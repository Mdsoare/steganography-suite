# Configuração do GitHub Dependabot para o Steganography Detector
version: 2
updates:
  # 1. GitHub Actions (Workflows e Reusable Actions)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci/cd"
      - "security"
    commit-message:
      prefix: "build(deps-dev)"
      include: "scope"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions-dependencies:
        patterns:
          - "*"

  # 2. JavaScript / Node.js (DevDependencies: ESLint, HTMLHint)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "fix(deps-js)"
      include: "scope"
